<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1918" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Élia">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Élia</title>
<style>
  :root {
    --bg: #f7f2ed; --card: #ffffff; --ink: #2b2522; --muted: #8a7f78;
    --line: #ebe3dc; --accent: #c4674b; --accent-soft: #f6e3dc; --accent-ink: #fff;
    --danger: #b3412f; --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1918; --card: #262321; --ink: #f1ebe6; --muted: #a39890;
      --line: #36312e; --accent: #d9805f; --accent-soft: #3a2a24; --accent-ink: #1b1918;
      --danger: #e2735f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 520px; margin: 0 auto; min-height: 100vh;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input { font: inherit; color: var(--ink); }
  .hidden { display: none !important; }

  /* Connexion */
  #login { padding-top: 18vh; text-align: center; }
  #login h1 { font-size: 26px; margin: 0 0 6px; }
  #login p { color: var(--muted); margin: 0 0 28px; }
  .field {
    width: 100%; padding: 15px 16px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); margin-bottom: 12px; font-size: 17px;
  }
  .btn-primary {
    width: 100%; padding: 17px; border-radius: 16px; background: var(--accent);
    color: var(--accent-ink); font-weight: 650; font-size: 18px;
  }
  .btn-primary:active { transform: scale(.98); }
  .error { color: var(--danger); min-height: 22px; margin-top: 10px; font-size: 15px; }

  /* En-tête date */
  .daynav { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; }
  .daynav button { width: 44px; height: 44px; border-radius: 50%; font-size: 24px; color: var(--muted); }
  .daynav button:disabled { opacity: .25; }
  .daytitle { text-align: center; }
  .daytitle b { display: block; font-size: 20px; }
  .daytitle span { font-size: 14px; color: var(--muted); }
  .daytitle button { font-size: 13px; color: var(--accent); width: auto; height: auto; }

  .since {
    text-align: center; color: var(--muted); font-size: 15px; margin-bottom: 14px;
  }
  .since b { color: var(--ink); }

  /* Résumé */
  .stats { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 10px; margin-bottom: 14px; }
  .stat {
    background: var(--card); border-radius: var(--radius); padding: 14px 10px; text-align: center;
    border: 1px solid var(--line);
  }
  .stat .v { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .stat .v small { font-size: 14px; font-weight: 600; color: var(--muted); }
  .stat .l { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .stepper { display: flex; align-items: center; justify-content: space-between; }
  .stepper button {
    width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent); font-size: 22px; font-weight: 700; line-height: 1;
  }
  .stepper button:disabled { opacity: .35; }

  .btn-big {
    width: 100%; padding: 22px; border-radius: 22px; background: var(--accent);
    color: var(--accent-ink); font-size: 20px; font-weight: 700; margin-bottom: 18px;
    box-shadow: 0 6px 18px -8px var(--accent);
  }
  .btn-big:active { transform: scale(.98); }

  /* Liste */
  .list { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
  .row {
    display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 10px;
    width: 100%; padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .row:active { background: var(--accent-soft); }
  .row .t { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row .d { font-size: 15px; }
  .row .gap { display: block; font-size: 13px; color: var(--muted); }
  .row .ml { font-weight: 650; font-variant-numeric: tabular-nums; }
  .row .ml.none { color: var(--muted); font-weight: 400; font-size: 14px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .row .pump { display: block; font-size: 12px; color: var(--muted); text-align: right; font-weight: 400; }

  /* Commentaire du jour */
  .comment { margin-top: 18px; }
  .comment label { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 4px 8px; }
  .comment label span { font-weight: 400; }
  .comment textarea {
    width: 100%; min-height: 96px; padding: 14px 16px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font: inherit; resize: vertical;
  }
  .comment textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  /* Onglets */
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-top: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  }
  .tabs button { padding: 10px 0; border-radius: 10px; font-weight: 650; color: var(--muted); }
  .tabs button.on { background: var(--accent); color: var(--accent-ink); }

  /* Sommeil */
  .card {
    background: var(--card); border-radius: var(--radius); border: 1px solid var(--line);
    padding: 14px 14px 10px; margin-bottom: 14px;
  }
  .card h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .card h3 b { color: var(--ink); }
  .card svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-axis { fill: var(--muted); font-size: 10px; font-family: inherit; }
  .chart-grid { stroke: var(--line); stroke-width: 1; }
  .chart-track { fill: var(--bg); }
  .chart-mark { fill: var(--accent); }
  .chart-mark.soft { fill: var(--accent); opacity: .45; }
  .chart-now { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 2 2; }
  .chart-value { fill: var(--ink); font-size: 11px; font-weight: 700; font-family: inherit; }
  .chart-hit { fill: transparent; cursor: pointer; }
  .btn-big.awake { background: var(--card); color: var(--accent); border: 2px solid var(--accent); box-shadow: none; }
  .row .ongoing { color: var(--accent); }

  .seg.two { grid-template-columns: 1fr 1fr; }
  .seg.two button { font-size: 17px; }

  .footer { display: flex; gap: 10px; margin-top: 22px; }
  .btn-soft {
    flex: 1; padding: 15px; border-radius: 14px; background: var(--card);
    border: 1px solid var(--line); font-weight: 600;
  }
  .btn-soft.accent { color: var(--accent); }
  .btn-link { display: block; margin: 18px auto 0; color: var(--muted); font-size: 14px; }

  /* Feuille d'édition */
  dialog {
    border: 0; padding: 0; width: 100%; max-width: 520px; margin: auto auto 0;
    background: var(--card); color: var(--ink); border-radius: 24px 24px 0 0;
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .sheet { padding: 22px 18px calc(env(safe-area-inset-bottom) + 18px); }
  .sheet h2 { margin: 0 0 18px; font-size: 20px; text-align: center; }
  .sheet label { display: block; font-size: 14px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .sheet .group { margin-bottom: 20px; }
  .sheet input[type=datetime-local], .sheet input[type=text] {
    width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--bg); font-size: 18px; min-height: 52px;
  }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .seg button {
    padding: 16px 0; border-radius: 14px; background: var(--bg); border: 2px solid var(--line);
    font-size: 22px; font-weight: 700;
  }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .mlrow { display: flex; gap: 8px; align-items: center; }
  .mlrow input { flex: 1; text-align: center; }
  .mlrow button {
    width: 56px; height: 52px; border-radius: 14px; background: var(--accent-soft);
    color: var(--accent); font-weight: 700; font-size: 15px;
  }
  .sheet .actions { display: flex; gap: 10px; }
  .sheet .actions .btn-primary { flex: 2; }
  .sheet .actions .btn-soft { flex: 1; }
  .btn-del { display: block; margin: 16px auto 0; color: var(--danger); font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-size: 15px;
    opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  .offline { text-align: center; font-size: 13px; color: var(--muted); padding-top: 8px; }
</style>
</head>
<body>

<!-- Écran de connexion -->
<section id="login" class="hidden">
  <h1>Élia</h1>
  <p>Connecte-toi pour continuer</p>
  <form id="loginForm">
    <input class="field" id="email" type="email" autocomplete="username" placeholder="E-mail" required>
    <input class="field" id="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required>
    <button class="btn-primary" type="submit">Se connecter</button>
    <div class="error" id="loginError"></div>
  </form>
</section>

<!-- Écran principal -->
<main id="app" class="hidden">
  <div class="offline hidden" id="offline">Hors connexion — les saisies seront synchronisées plus tard</div>

  <div class="tabs" role="tablist">
    <button type="button" data-tab="tetees" role="tab">Tétées</button>
    <button type="button" data-tab="sommeil" role="tab">Sommeil</button>
  </div>

  <nav class="daynav">
    <button id="prevDay" aria-label="Jour précédent">‹</button>
    <div class="daytitle">
      <b id="dayLabel">Aujourd'hui</b>
      <span id="dayDate"></span>
      <div><button id="goToday" class="hidden">Revenir à aujourd'hui</button></div>
    </div>
    <button id="nextDay" aria-label="Jour suivant">›</button>
  </nav>

  <section id="paneTetees">
  <div class="since" id="since">&nbsp;</div>

  <div class="stats">
    <div class="stat"><div class="v" id="nbTetees">0</div><div class="l">tétées</div></div>
    <div class="stat"><div class="v" id="totalMl">0<small> ml</small></div><div class="l">lait tiré</div></div>
    <div class="stat">
      <div class="stepper">
        <button id="sellesMinus" aria-label="Retirer une selle">−</button>
        <div class="v" id="selles">0</div>
        <button id="sellesPlus" aria-label="Ajouter une selle">+</button>
      </div>
      <div class="l">selles</div>
    </div>
  </div>

  <button class="btn-big" id="newTetee">+ Nouvelle tétée</button>

  <div class="list" id="list"></div>
  </section>

  <section id="paneSommeil" class="hidden">
    <div class="since" id="sleepSince">&nbsp;</div>
    <div class="stats">
      <div class="stat"><div class="v" id="nbDodos">0</div><div class="l">dodos</div></div>
      <div class="stat"><div class="v" id="totalSleep">0<small> h</small></div><div class="l">de sommeil</div></div>
      <div class="stat"><div class="v" id="longestSleep">—</div><div class="l">plus long</div></div>
    </div>

    <button class="btn-big" id="sleepBtn">Elle s'endort</button>

    <div class="card">
      <h3>Journée heure par heure</h3>
      <svg id="dayTimeline" viewBox="0 0 340 46" role="img" aria-label="Périodes de sommeil de la journée"></svg>
    </div>

    <div class="list" id="sleepList"></div>
    <button class="btn-link" id="addSleep" style="color:var(--accent)">+ Ajouter un dodo oublié</button>

    <div class="card" style="margin-top:18px">
      <h3 id="chartTitle">Heures de sommeil par jour</h3>
      <svg id="sleepChart" viewBox="0 0 340 170" role="img" aria-label="Heures de sommeil des 14 derniers jours"></svg>
    </div>
  </section>

  <div class="comment">
    <label for="commentaire">Commentaire du jour <span id="commentState"></span></label>
    <textarea id="commentaire" placeholder="Note libre pour cette journée…"></textarea>
  </div>

  <div class="footer">
    <button class="btn-soft accent" id="exportBtn">Exporter (Excel)</button>
  </div>
  <button class="btn-link" id="logout">Se déconnecter</button>
</main>

<!-- Feuille ajout / modification -->
<dialog id="sheet">
  <form class="sheet" id="teteeForm" method="dialog">
    <h2 id="sheetTitle">Nouvelle tétée</h2>
    <div class="group">
      <label for="when">Heure</label>
      <input type="datetime-local" id="when" required>
    </div>
    <div class="group">
      <label>Nombre de seins donnés</label>
      <div class="seg" id="seins">
        <button type="button" data-v="1">1</button>
        <button type="button" data-v="2">2</button>
        <button type="button" data-v="3">3</button>
        <button type="button" data-v="4">4</button>
      </div>
    </div>
    <div class="group">
      <label for="ml">Lait tiré après la tétée (ml) — facultatif</label>
      <div class="mlrow">
        <button type="button" data-step="-5">−5</button>
        <input type="text" id="ml" inputmode="decimal" placeholder="—" autocomplete="off">
        <button type="button" data-step="5">+5</button>
      </div>
    </div>
    <div class="group">
      <label>Tire-lait utilisé</label>
      <div class="seg two" id="pumps">
        <button type="button" data-v="momcozy">Momcozy</button>
        <button type="button" data-v="spectra">Spectra</button>
      </div>
    </div>
    <div class="error" id="formError"></div>
    <div class="actions">
      <button type="button" class="btn-soft" id="cancelBtn">Annuler</button>
      <button type="submit" class="btn-primary" id="saveBtn">Enregistrer</button>
    </div>
    <button type="button" class="btn-del hidden" id="deleteBtn">Supprimer cette tétée</button>
  </form>
</dialog>

<!-- Feuille ajout / modification d'un dodo -->
<dialog id="sleepSheet">
  <form class="sheet" id="sleepForm" method="dialog">
    <h2 id="sleepTitle">Dodo</h2>
    <div class="group">
      <label for="sleepStart">Endormie à</label>
      <input type="datetime-local" id="sleepStart" required>
    </div>
    <div class="group">
      <label for="sleepEnd">Réveillée à</label>
      <input type="datetime-local" id="sleepEnd">
      <button type="button" class="btn-link" id="sleepStillAsleep" style="margin-top:8px;color:var(--accent)">Elle dort encore (effacer l'heure de réveil)</button>
    </div>
    <div class="error" id="sleepError"></div>
    <div class="actions">
      <button type="button" class="btn-soft" id="sleepCancel">Annuler</button>
      <button type="submit" class="btn-primary">Enregistrer</button>
    </div>
    <button type="button" class="btn-del hidden" id="sleepDelete">Supprimer ce dodo</button>
  </form>
</dialog>

<!-- Feuille export -->
<dialog id="exportSheet">
  <div class="sheet">
    <h2>Exporter</h2>
    <p id="exportInfo" style="text-align:center;color:var(--muted);margin:0 0 18px">Préparation…</p>
    <div class="actions" style="flex-direction:column">
      <button class="btn-primary hidden" id="shareBtn">Partager / envoyer</button>
      <button class="btn-soft hidden" id="downloadBtn">Télécharger le fichier</button>
      <button class="btn-soft" id="closeExport">Fermer</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script type="module">
/* ============================================================
   1) COLLE ICI LA CONFIGURATION DE TON PROJET FIREBASE
      (Console Firebase → Paramètres du projet → Vos applications → Config)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBI84d_1z4thXKPdT6KBtiBeVRKKihbOPs",
  authDomain: "suiviallaitement.firebaseapp.com",
  databaseURL: "https://suiviallaitement-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "suiviallaitement",
  storageBucket: "suiviallaitement.firebasestorage.app",
  messagingSenderId: "913739337080",
  appId: "1:913739337080:web:f023a72e9948f014bb4c8d"
};
/* ============================================================ */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, addDoc, updateDoc, deleteDoc, setDoc, getDocs, onSnapshot,
  query, where, orderBy, limit, Timestamp, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = (id) => document.getElementById(id);

if (firebaseConfig.apiKey === "A_REMPLACER") {
  document.body.innerHTML = '<p style="padding:40px 10px;text-align:center">⚙️ La configuration Firebase n\'est pas encore renseignée dans <b>index.html</b>.<br><br>Voir le fichier LISEZMOI.md.</p>';
  throw new Error("Config Firebase manquante");
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

/* ---------- Utilitaires de date ---------- */
const pad = (n) => String(n).padStart(2, "0");
const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hhmm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const frDate = (d) => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
const toLocalInput = (d) => `${dayKey(d)}T${hhmm(d)}`;
const sameDay = (a, b) => dayKey(a) === dayKey(b);
function duration(ms) {
  const min = Math.max(0, Math.round(ms / 60000));
  const h = Math.floor(min / 60), m = min % 60;
  if (h === 0) return `${m} min`;
  return `${h} h ${pad(m)}`;
}
const longDate = (d) => d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
const fmtMl = (n) => (Math.round(n * 10) / 10).toLocaleString("fr-FR");

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------- État ---------- */
let uid = null;
let viewDay = startOfDay(new Date());
let dayTetees = [];        // tétées du jour affiché
let sellesCount = 0;
let lastTime = null;       // dernière tétée (toutes dates)
let unsubs = [];
let lastUnsub = null;
let latestDodoUnsub = null;

const teteesCol = () => collection(db, "users", uid, "tetees");
const jourDoc = (key) => doc(db, "users", uid, "jours", key);

/* ---------- Authentification ---------- */
onAuthStateChanged(auth, (user) => {
  if (user) {
    uid = user.uid;
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    viewDay = startOfDay(new Date());
    subscribeLast();
    subscribeLatestDodo();
    subscribeDay();
  } else {
    uid = null;
    unsubs.forEach((u) => u()); unsubs = [];
    if (lastUnsub) { lastUnsub(); lastUnsub = null; }
    if (latestDodoUnsub) { latestDodoUnsub(); latestDodoUnsub = null; }
    latestDodo = null; rangeDodos = [];
    $("app").classList.add("hidden");
    $("login").classList.remove("hidden");
  }
});

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginError").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
  } catch (err) {
    const code = err.code || "";
    $("loginError").textContent =
      code.includes("invalid") || code.includes("wrong-password") || code.includes("user-not-found")
        ? "E-mail ou mot de passe incorrect."
        : code.includes("network") ? "Pas de connexion internet."
        : code.includes("too-many") ? "Trop de tentatives, réessaie dans un moment."
        : "Connexion impossible (" + code + ").";
  }
});
$("logout").addEventListener("click", () => {
  if (confirm("Se déconnecter ?")) signOut(auth);
});

/* ---------- Abonnements temps réel ---------- */
let followToday = true;
function subscribeDay() {
  flushComment();
  followToday = sameDay(viewDay, new Date());
  unsubs.forEach((u) => u()); unsubs = [];
  $("commentaire").value = ""; $("commentState").textContent = "";
  const start = viewDay, end = addDays(viewDay, 1);
  const q = query(teteesCol(),
    where("time", ">=", Timestamp.fromDate(start)),
    where("time", "<", Timestamp.fromDate(end)),
    orderBy("time", "asc"));
  unsubs.push(onSnapshot(q, (snap) => {
    dayTetees = snap.docs.map((d) => ({ id: d.id, ...d.data(), date: d.data().time.toDate() }));
    render();
  }, (err) => toast("Erreur de lecture : " + err.code)));
  unsubs.push(onSnapshot(jourDoc(dayKey(viewDay)), (snap) => {
    sellesCount = Math.max(0, (snap.exists() && snap.data().selles) || 0);
    renderSelles();
    // on ne remplace pas le texte pendant que l'utilisateur est en train d'écrire
    if (document.activeElement !== $("commentaire") && !commentPending) {
      $("commentaire").value = (snap.exists() && snap.data().commentaire) || "";
    }
  }));
  rangeDodos = [];
  unsubs.push(subscribeSleepRange());
  renderHeader();
  renderSleep();
}

function subscribeLast() {
  if (lastUnsub) lastUnsub();
  const q = query(teteesCol(), orderBy("time", "desc"), limit(1));
  lastUnsub = onSnapshot(q, (snap) => {

/* ---------- Sommeil ----------
   Collection "users/{uid}/dodos" : { debut: Timestamp, fin: Timestamp | null }
   fin = null  ->  dodo en cours (elle dort encore) */
const CHART_DAYS = 14;
const dodosCol = () => collection(db, "users", uid, "dodos");
const mapDodo = (d) => {
  const x = d.data();
  return { id: d.id, debut: x.debut.toDate(), fin: x.fin ? x.fin.toDate() : null };
};
let rangeDodos = [];      // dodos commencés dans la fenêtre du graphique
let latestDodo = null;    // dernier dodo (toutes dates), pour savoir si elle dort
const ongoing = () => (latestDodo && !latestDodo.fin ? latestDodo : null);
const dodoEnd = (d) => d.fin || new Date();

function subscribeLatestDodo() {
  if (latestDodoUnsub) latestDodoUnsub();
  latestDodoUnsub = onSnapshot(query(dodosCol(), orderBy("debut", "desc"), limit(1)), (snap) => {
    latestDodo = snap.empty ? null : mapDodo(snap.docs[0]);
    renderSleep();
  });
}

function subscribeSleepRange() {
  const from = addDays(viewDay, -CHART_DAYS), to = addDays(viewDay, 1);
  return onSnapshot(query(dodosCol(),
    where("debut", ">=", Timestamp.fromDate(from)),
    where("debut", "<", Timestamp.fromDate(to)),
    orderBy("debut", "asc")), (snap) => {
      rangeDodos = snap.docs.map(mapDodo);
      renderSleep();
    }, (err) => toast("Erreur de lecture : " + err.code));
}

// temps de sommeil (ms) compris dans la journée commençant à dayStart
function sleepMsInDay(dayStart, list) {
  const s = dayStart.getTime(), e = addDays(dayStart, 1).getTime();
  let ms = 0;
  for (const d of list) {
    const a = Math.max(d.debut.getTime(), s), b = Math.min(dodoEnd(d).getTime(), e);
    if (b > a) ms += b - a;
  }
  return ms;
}
const fmtH = (ms) => {
  const min = Math.round(ms / 60000);
  return `${Math.floor(min / 60)} h ${pad(min % 60)}`;
};
const fmtHShort = (ms) => {
  const min = Math.round(ms / 60000);
  if (min < 60) return `${min}<small> min</small>`;
  return `${Math.floor(min / 60)}<small> h </small>${pad(min % 60)}`;
};

function renderSleepSince() {
  const cur = ongoing();
  if (cur) {
    $("sleepSince").innerHTML = `Endormie à <b>${hhmm(cur.debut)}</b>${sameDay(cur.debut, new Date()) ? "" : " (" + frDate(cur.debut) + ")"} · dort depuis <b>${duration(Date.now() - cur.debut)}</b>`;
  } else if (latestDodo) {
    const f = latestDodo.fin;
    $("sleepSince").innerHTML = `Réveillée à <b>${hhmm(f)}</b>${sameDay(f, new Date()) ? "" : " (" + frDate(f) + ")"} · éveillée depuis <b>${duration(Date.now() - f)}</b>`;
  } else {
    $("sleepSince").textContent = "Aucun dodo enregistré pour l'instant";
  }
  const btn = $("sleepBtn");
  btn.textContent = cur ? "Elle se réveille" : "Elle s'endort";
  btn.classList.toggle("awake", !!cur);
}

function renderSleep() {
  if (!uid) return;
  renderSleepSince();
  if (currentTab !== "sommeil") return;

  const start = viewDay, end = addDays(viewDay, 1);
  // la liste du dodo en cours peut ne pas encore être dans rangeDodos : on la complète
  const all = [...rangeDodos];
  const cur = ongoing();
  if (cur && !all.some((d) => d.id === cur.id) && cur.debut < end) all.push(cur);
  const inDay = all.filter((d) => d.debut < end && dodoEnd(d) > start);
  const startedToday = inDay.filter((d) => d.debut >= start);

  $("nbDodos").textContent = startedToday.length;
  $("totalSleep").innerHTML = fmtHShort(sleepMsInDay(start, all));
  const longest = startedToday.reduce((m, d) => Math.max(m, dodoEnd(d) - d.debut), 0);
  $("longestSleep").innerHTML = longest ? fmtHShort(longest) : "—";

  renderTimeline(inDay);
  renderSleepList(inDay);
  renderChart(all);
}

function renderSleepList(inDay) {
  const list = $("sleepList");
  if (!inDay.length) { list.innerHTML = '<div class="empty">Aucun dodo ce jour-là.</div>'; return; }
  list.innerHTML = "";
  for (let i = inDay.length - 1; i >= 0; i--) {
    const d = inDay[i];
    const row = document.createElement("button");
    row.className = "row";
    const before = d.debut < viewDay;
    const after = d.fin && d.fin >= addDays(viewDay, 1);
    row.innerHTML = `
      <span class="t">${hhmm(d.debut)}</span>
      <span class="d">${d.fin ? `→ ${hhmm(d.fin)}` : `<span class="ongoing">dort encore</span>`}
        ${before ? `<span class="gap">commencé la veille</span>` : after ? `<span class="gap">se termine le lendemain</span>` : ""}
      </span>
      <span class="ml">${duration(dodoEnd(d) - d.debut)}</span>`;
    row.addEventListener("click", () => openSleepSheet(d));
    list.appendChild(row);
  }
}

// Frise 0 h - 24 h de la journée affichée
function renderTimeline(inDay) {
  const W = 340, X0 = 4, X1 = W - 4, Y = 6, H = 20;
  const s = viewDay.getTime(), span = 86400000;
  const x = (t) => X0 + (X1 - X0) * Math.min(1, Math.max(0, (t - s) / span));
  let out = `<rect class="chart-track" x="${X0}" y="${Y}" width="${X1 - X0}" height="${H}" rx="4"/>`;
  for (const d of inDay) {
    const a = x(d.debut.getTime()), b = x(dodoEnd(d).getTime());
    if (b - a < 0.5) continue;
    out += `<rect class="chart-mark${d.fin ? "" : " soft"}" x="${a.toFixed(1)}" y="${Y}" width="${Math.max(2, b - a).toFixed(1)}" height="${H}" rx="3"><title>${hhmm(d.debut)} → ${d.fin ? hhmm(d.fin) : "en cours"} (${duration(dodoEnd(d) - d.debut)})</title></rect>`;
  }
  for (const h of [0, 6, 12, 18, 24]) {
    const xx = X0 + (X1 - X0) * h / 24;
    out += `<text class="chart-axis" x="${xx}" y="${Y + H + 14}" text-anchor="${h === 0 ? "start" : h === 24 ? "end" : "middle"}">${h} h</text>`;
  }
  if (sameDay(viewDay, new Date())) {
    const n = x(Date.now());
    out += `<line class="chart-now" x1="${n}" x2="${n}" y1="${Y - 3}" y2="${Y + H + 3}"/>`;
  }
  $("dayTimeline").innerHTML = out;
}

// Barres : heures de sommeil des 14 jours jusqu'au jour affiché (toucher une barre pour aller à ce jour)
function renderChart(all) {
  const W = 340, H = 170, L = 26, R = 4, T = 18, B = 22;
  const days = [];
  for (let i = CHART_DAYS - 1; i >= 0; i--) {
    const day = addDays(viewDay, -i);
    days.push({ day, ms: day > new Date() ? 0 : sleepMsInDay(day, all) });
  }
  const maxH = Math.max(4, ...days.map((d) => d.ms / 3600000));
  const step = maxH > 16 ? 6 : maxH > 8 ? 4 : 2;
  const top = Math.ceil(maxH / step) * step;
  const y = (h) => T + (H - T - B) * (1 - h / top);
  const slot = (W - L - R) / CHART_DAYS, bw = Math.min(16, slot - 2);
  let out = "";
  for (let h = 0; h <= top; h += step) {
    out += `<line class="chart-grid" x1="${L}" x2="${W - R}" y1="${y(h)}" y2="${y(h)}"/>`;
    out += `<text class="chart-axis" x="${L - 5}" y="${y(h) + 3.5}" text-anchor="end">${h} h</text>`;
  }
  days.forEach((d, i) => {
    const cx = L + slot * i + slot / 2, h = d.ms / 3600000, yy = y(h), base = y(0);
    const selected = i === CHART_DAYS - 1;
    if (h > 0) {
      const r = Math.min(4, base - yy, bw / 2), x0 = cx - bw / 2;
      out += `<path class="chart-mark${selected ? "" : " soft"}" d="M${x0},${base}V${yy + r}Q${x0},${yy} ${x0 + r},${yy}H${x0 + bw - r}Q${x0 + bw},${yy} ${x0 + bw},${yy + r}V${base}Z"/>`;
    }
    if (selected) out += `<text class="chart-value" x="${cx}" y="${yy - 5}" text-anchor="middle">${fmtH(d.ms).replace(" ", "")}</text>`;
    if (i % 2 === (CHART_DAYS - 1) % 2) {
      out += `<text class="chart-axis" x="${cx}" y="${H - 6}" text-anchor="middle">${pad(d.day.getDate())}/${pad(d.day.getMonth() + 1)}</text>`;
    }
    out += `<rect class="chart-hit" data-day="${dayKey(d.day)}" x="${L + slot * i}" y="${T - 10}" width="${slot}" height="${H - T - B + 10}"><title>${frDate(d.day)} : ${fmtH(d.ms)}</title></rect>`;
  });
  const svg = $("sleepChart");
  svg.innerHTML = out;
  svg.querySelectorAll(".chart-hit").forEach((r) => r.addEventListener("click", () => {
    const [yy, mm, dd] = r.dataset.day.split("-").map(Number);
    const d = new Date(yy, mm - 1, dd);
    if (!sameDay(d, viewDay) && d <= new Date()) { viewDay = d; subscribeDay(); }
  }));
  $("chartTitle").innerHTML = `Heures de sommeil par jour · <b>${CHART_DAYS} jours</b>`;
}

/* Bouton principal : endormie / réveillée (toujours à l'heure actuelle) */
$("sleepBtn").addEventListener("click", async () => {

/* Ajout / modification a posteriori */
let editingDodo = null;
function openSleepSheet(d = null) {

      : new Date(viewDay.getFullYear(), viewDay.getMonth(), viewDay.getDate(), now.getHours(), now.getMinutes());
    $("sleepStart").value = toLocalInput(new Date(base - 3600000));

}
$("addSleep").addEventListener("click", () => openSleepSheet());
$("sleepCancel").addEventListener("click", () => $("sleepSheet").close());
$("sleepStillAsleep").addEventListener("click", () => { $("sleepEnd").value = ""; });

$("sleepForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = (m) => { $("sleepError").textContent = m; };
  const debut = $("sleepStart").value ? new Date($("sleepStart").value) : null;
  const fin = $("sleepEnd").value ? new Date($("sleepEnd").value) : null;
  const soon = Date.now() + 60000;
  if (!debut || isNaN(debut)) return err("Indique l'heure d'endormissement.");
  if (debut > soon) return err("L'heure d'endormissement est dans le futur.");
  if (fin) {
    if (isNaN(fin)) return err("Heure de réveil invalide.");
    if (fin <= debut) return err("Le réveil doit être après l'endormissement.");
    if (fin > soon) return err("L'heure de réveil est dans le futur.");
  } else {
    // un seul dodo "en cours", et ce doit être le plus récent
    const cur = ongoing();
    if (cur && (!editingDodo || cur.id !== editingDodo.id)) return err("Un dodo est déjà en cours : enregistre d'abord son réveil.");
    if (latestDodo && (!editingDodo || latestDodo.id !== editingDodo.id) && latestDodo.debut > debut)
      return err("Indique l'heure de réveil (il y a eu un dodo plus récent).");
  }
  const data = { debut: Timestamp.fromDate(debut), fin: fin ? Timestamp.fromDate(fin) : null };
  const wasEditing = editingDodo;
  $("sleepSheet").close();
  try {
    const p = wasEditing ? updateDoc(doc(dodosCol(), wasEditing.id), data) : addDoc(dodosCol(), data);
    toast(wasEditing ? "Dodo modifié" : "Dodo enregistré");
    if (!sameDay(debut, viewDay) && !(fin && sameDay(fin, viewDay))) { viewDay = startOfDay(debut); subscribeDay(); }
    await p;
  } catch (e2) { toast("Erreur d'enregistrement : " + e2.code); }
});

$("sleepDelete").addEventListener("click", async () => {
  if (!editingDodo || !confirm("Supprimer ce dodo ?")) return;
  const id = editingDodo.id;
  $("sleepSheet").close();
  try { const p = deleteDoc(doc(dodosCol(), id)); toast("Dodo supprimé"); await p; }
  catch (err) { toast("Erreur : " + err.code); }
});

/* ---------- Ajout / modification d'une tétée ---------- */
let editing = null;
let seinsVal = null;

function setSeins(v) {
  seinsVal = v;
  document.querySelectorAll("#seins button").forEach((b) => b.classList.toggle("on", Number(b.dataset.v) === v));
}
document.querySelectorAll("#seins button").forEach((b) =>
  b.addEventListener("click", () => setSeins(Number(b.dataset.v))));

const PUMPS = { momcozy: "Momcozy", spectra: "Spectra" };
let pumpVal = null;
function setPump(v) {
  pumpVal = PUMPS[v] ? v : null;
  document.querySelectorAll("#pumps button").forEach((b) => b.classList.toggle("on", b.dataset.v === pumpVal));
}
// un second appui sur le tire-lait sélectionné le désélectionne
document.querySelectorAll("#pumps button").forEach((b) =>
  b.addEventListener("click", () => setPump(pumpVal === b.dataset.v ? null : b.dataset.v)));
const lastPump = () => { try { return localStorage.getItem("dernierTireLait"); } catch { return null; } };

document.querySelectorAll(".mlrow button").forEach((b) =>
  b.addEventListener("click", () => {
    const cur = parseFloat(($("ml").value || "0").replace(",", ".")) || 0;
    const next = Math.max(0, cur + Number(b.dataset.step));
    $("ml").value = next ? String(next).replace(".", ",") : "";
  }));

function openSheet(t = null) {
  editing = t;
  $("formError").textContent = "";
  if (t) {
    $("sheetTitle").textContent = "Modifier la tétée";
    $("when").value = toLocalInput(t.date);
    setSeins(t.seins);
    $("ml").value = typeof t.ml === "number" ? String(t.ml).replace(".", ",") : "";
    setPump(t.tireLait || null);
    $("deleteBtn").classList.remove("hidden");
  } else {
    $("sheetTitle").textContent = "Nouvelle tétée";
    const now = new Date();
    const d = sameDay(viewDay, now) ? now
      : new Date(viewDay.getFullYear(), viewDay.getMonth(), viewDay.getDate(), now.getHours(), now.getMinutes());
    $("when").value = toLocalInput(d);
    setSeins(null);
    $("ml").value = "";
    setPump(lastPump());   // pré-sélection du dernier tire-lait utilisé
    $("deleteBtn").classList.add("hidden");
  }
  $("sheet").showModal();
}
$("newTetee").addEventListener("click", () => openSheet());
$("cancelBtn").addEventListener("click", () => $("sheet").close());

$("teteeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const when = $("when").value ? new Date($("when").value) : null;
  if (!when || isNaN(when)) { $("formError").textContent = "Indique l'heure."; return; }
  if (!seinsVal) { $("formError").textContent = "Indique le nombre de seins donnés."; return; }
  const raw = $("ml").value.trim().replace(",", ".");
  let ml = null;
  if (raw !== "") {
    ml = parseFloat(raw);
    if (isNaN(ml) || ml < 0) { $("formError").textContent = "Quantité de lait invalide."; return; }
  }
  const data = { time: Timestamp.fromDate(when), seins: seinsVal, ml };
  // tire-lait : enregistré seulement s'il y a du lait tiré ; les anciennes tétées
  // sans tire-lait ne reçoivent aucun champ supplémentaire tant qu'on n'en choisit pas un
  const pump = ml !== null ? pumpVal : null;
  if (pump) {
    data.tireLait = pump;
    try { localStorage.setItem("dernierTireLait", pump); } catch {}
  } else if (editing && editing.tireLait) {
    data.tireLait = null;
  }
  $("sheet").close();
  try {
    // pas d'await bloquant : fonctionne aussi hors connexion
    const p = editing ? updateDoc(doc(teteesCol(), editing.id), data) : addDoc(teteesCol(), data);
    toast(editing ? "Tétée modifiée" : "Tétée enregistrée");
    if (!sameDay(when, viewDay)) { viewDay = startOfDay(when); subscribeDay(); }
    await p;
  } catch (err) { toast("Erreur d'enregistrement : " + err.code); }
});

$("deleteBtn").addEventListener("click", async () => {
  if (!editing || !confirm("Supprimer cette tétée ?")) return;
  const id = editing.id;
  $("sheet").close();
  try { const p = deleteDoc(doc(teteesCol(), id)); toast("Tétée supprimée"); await p; }
  catch (err) { toast("Erreur : " + err.code); }
});

/* ---------- Export Excel ---------- */
let exportFile = null;

$("exportBtn").addEventListener("click", async () => {
  exportFile = null;
  $("exportInfo").textContent = "Préparation du fichier…";
  $("shareBtn").classList.add("hidden");
  $("downloadBtn").classList.add("hidden");
  $("exportSheet").showModal();
  try {
    const [tSnap, jSnap, dSnap] = await Promise.all([
      getDocs(query(teteesCol(), orderBy("time", "asc"))),
      getDocs(collection(db, "users", uid, "jours")),
      getDocs(query(dodosCol(), orderBy("debut", "asc"))),
    ]);
    const dodos = dSnap.docs.map(mapDodo);
    const tetees = tSnap.docs.map((d) => ({ ...d.data(), date: d.data().time.toDate() }));
    const selles = {}, commentaires = {};
    jSnap.docs.forEach((d) => {
      selles[d.id] = Math.max(0, d.data().selles || 0);
      if (d.data().commentaire) commentaires[d.id] = d.data().commentaire;
    });

    // Feuille 1 : une ligne par tétée
    const rowsTetees = tetees.map((t) => ({
      "Date": frDate(t.date),
      "Heure": hhmm(t.date),
      "Seins donnés": t.seins,
      "Lait tiré (ml)": typeof t.ml === "number" ? t.ml : "",
      "Tire-lait": PUMPS[t.tireLait] || "",
    }));

    // Feuille 2 : résumé par jour
    const days = {};
    tetees.forEach((t) => {
      const k = dayKey(t.date);
      days[k] ??= { n: 0, ml: 0 };
      days[k].n++; days[k].ml += typeof t.ml === "number" ? t.ml : 0;
    });
    Object.keys(selles).forEach((k) => { days[k] ??= { n: 0, ml: 0 }; });
    // sommeil : nombre de dodos commencés dans la journée + temps dormi dans la journée (coupé à minuit)
    const sleepDays = {};
    dodos.forEach((d) => {
      const k0 = dayKey(d.debut);
      sleepDays[k0] ??= { n: 0, ms: 0 }; sleepDays[k0].n++;
      for (let day = startOfDay(d.debut); day < dodoEnd(d); day = addDays(day, 1)) {
        const k = dayKey(day);
        sleepDays[k] ??= { n: 0, ms: 0 };
        sleepDays[k].ms += sleepMsInDay(day, [d]);
      }
    });
    Object.keys(sleepDays).forEach((k) => { days[k] ??= { n: 0, ml: 0 }; });
    const rowsJours = Object.keys(days).sort().map((k) => {
      const [y, m, d] = k.split("-");
      return {
        "Date": `${d}/${m}/${y}`,
        "Nombre de tétées": days[k].n,
        "Total lait tiré (ml)": Math.round(days[k].ml * 10) / 10,
        "Selles": selles[k] || 0,
        "Nombre de dodos": sleepDays[k] ? sleepDays[k].n : 0,
        "Sommeil total (h)": sleepDays[k] ? Math.round(sleepDays[k].ms / 360000) / 10 : 0,
        "Commentaire": commentaires[k] || "",
      };
    });

    const XLSX = await import("https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs");
    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.json_to_sheet(rowsTetees, { header: ["Date", "Heure", "Seins donnés", "Lait tiré (ml)", "Tire-lait"] });
    ws1["!cols"] = [{ wch: 12 }, { wch: 8 }, { wch: 14 }, { wch: 16 }, { wch: 12 }];
    const ws2 = XLSX.utils.json_to_sheet(rowsJours, { header: ["Date", "Nombre de tétées", "Total lait tiré (ml)", "Selles", "Nombre de dodos", "Sommeil total (h)", "Commentaire"] });
    ws2["!cols"] = [{ wch: 12 }, { wch: 18 }, { wch: 20 }, { wch: 8 }, { wch: 16 }, { wch: 18 }, { wch: 50 }];
    const rowsDodos = dodos.map((d) => ({
      "Date": frDate(d.debut),
      "Endormie à": hhmm(d.debut),
      "Réveillée à": d.fin ? (sameDay(d.fin, d.debut) ? hhmm(d.fin) : `${hhmm(d.fin)} (${frDate(d.fin)})`) : "en cours",
      "Durée (min)": d.fin ? Math.round((d.fin - d.debut) / 60000) : "",
    }));
    const ws3 = XLSX.utils.json_to_sheet(rowsDodos, { header: ["Date", "Endormie à", "Réveillée à", "Durée (min)"] });
    ws3["!cols"] = [{ wch: 12 }, { wch: 12 }, { wch: 22 }, { wch: 12 }];
    XLSX.utils.book_append_sheet(wb, ws1, "Tétées");
    XLSX.utils.book_append_sheet(wb, ws2, "Résumé par jour");
    XLSX.utils.book_append_sheet(wb, ws3, "Sommeil");
    const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const name = `suivi-allaitement-${dayKey(new Date())}.xlsx`;
    exportFile = new File([buf], name, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });

    $("exportInfo").textContent = `${tetees.length} tétée(s), ${dodos.length} dodo(s) sur ${rowsJours.length} jour(s) — fichier prêt.`;
    if (navigator.canShare && navigator.canShare({ files: [exportFile] })) $("shareBtn").classList.remove("hidden");
    $("downloadBtn").classList.remove("hidden");
  } catch (err) {
    console.error(err);
    $("exportInfo").textContent = "Impossible de préparer le fichier (connexion internet nécessaire pour l'export).";
  }
});

$("shareBtn").addEventListener("click", async () => {
  if (!exportFile) return;
  try { await navigator.share({ files: [exportFile], title: "Suivi allaitement" }); }
  catch (e) { if (e.name !== "AbortError") toast("Partage impossible, utilise Télécharger"); }
});
$("downloadBtn").addEventListener("click", () => {
  if (!exportFile) return;
  const url = URL.createObjectURL(exportFile);
  const a = document.createElement("a");
  a.href = url; a.download = exportFile.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
});
$("closeExport").addEventListener("click", () => $("exportSheet").close());
</script>
</body>
</html>
